<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 这是送给朋友的东西，不想被搜索引擎收录：有网址的人才打得开 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>雾凇黄山</title>
    <script type="module" crossorigin src="./assets/index-CaNVMJMy.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C0Nm9R3k.css">
  </head>
  <body>
    <script>
      // 触屏设备一打开就用触屏的提示和按钮，不等山路搭好。
      // （原先要等后面的程序读完才换，加载的那几秒，平板上看到的是"W A S D、鼠标"这些电脑的提示。
      //   读完以后由 controls.js 接着管：碰过屏幕就是触屏，动了鼠标就换回电脑的）
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
    </script>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>

    <div id="next-stop"></div>
    <div id="desktop-hint"></div>

    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="walk-btn" role="button" aria-label="沿路前行">
      <span>沿路<br />前行</span>
    </div>

    <div id="tools">
      <button id="weather-btn" type="button"><small>天气</small><b id="weather-name">晴朗</b></button>
      <button id="sound-btn" type="button"><small>声音</small><b id="sound-state">开</b></button>
      <button id="journal-btn" type="button">手账<span id="journal-count"></span></button>
      <button id="photo-btn" type="button">拍照</button>
    </div>
    <div id="sound-panel" class="hidden">
      <div class="line">
        <span>声音</span>
        <div class="chips">
          <button type="button" data-sound="on">开</button>
          <button type="button" data-sound="off">关</button>
        </div>
      </div>
      <div class="line">
        <span>踩雪声</span>
        <div class="chips">
          <button type="button" data-step="auto">跟着天气</button>
          <button type="button" data-step="0">新雪</button>
          <button type="button" data-step="1">干雪</button>
          <button type="button" data-step="2">硬雪</button>
        </div>
      </div>
      <p id="step-now"></p>
    </div>
    <button id="stamp-btn" type="button" hidden>盖章</button>
    <div id="toast"></div>
    <div id="meter" hidden></div>
    <div id="flash"></div>

    <div id="journal" class="sheet hidden">
      <div class="page">
        <h2>黄山游览手账</h2>
        <div id="seals"></div>
        <div id="album" hidden></div>
        <p id="journal-note"></p>
        <div class="row">
          <button id="postcard-open" type="button" class="primary" hidden>看明信片</button>
          <button id="journal-close" type="button">合上</button>
        </div>
      </div>
    </div>

    <div id="postcard" class="sheet hidden">
      <div class="page wide">
        <img id="postcard-img" alt="明信片" />
        <p class="tip">长按图片也可以保存</p>
        <div class="row">
          <button id="postcard-save" type="button" class="primary">保存 / 分享</button>
          <button id="postcard-swap" type="button" hidden>换一张照片</button>
          <button id="postcard-close" type="button">关闭</button>
        </div>
      </div>
    </div>

    <div id="start">
      <div class="card">
        <h1>雾凇黄山</h1>
        <p class="sub">从天亮前的一线天出发，走到光明顶看日出</p>
        <ul class="hints for-touch">
          <li>点一下<b>「沿路前行」</b>会自己往前走，再点一下停下</li>
          <li>手指在画面上滑动，看四周</li>
          <li>想自己走，就拨动左下角的圆盘</li>
        </ul>
        <ul class="hints for-desktop">
          <li><b>W A S D</b> 走路</li>
          <li>移动鼠标看四周，<b>Esc</b> 放开鼠标</li>
          <li>按一下<b>空格</b>会自己沿路往前走，再按一下停下</li>
        </ul>
        <p class="sub">每到一个景点，在小铺的柜台前盖一个章；到了山顶，带走一张明信片<br />右上角可以换天气、开关声音</p>
        <button id="resume-btn" type="button" hidden>接着上次走</button>
        <button id="start-btn" type="button" disabled>正在准备山路…</button>
      </div>
    </div>

    <script>
      // 页面还没准备好就出了错（多半是浏览器太旧），在按钮上说一声，免得一直停在"正在准备"
      window.addEventListener('error', function () {
        var button = document.getElementById('start-btn');
        if (button && button.disabled) button.textContent = '这个浏览器打不开，换一个试试';
      });
    </script>
  </body>
</html>
